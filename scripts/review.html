<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attenborough Clip Review</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1f1c; --muted: #6b6f68; --line: #e3e1da;
  --accent: #2f6b4f; --accent-ink: #ffffff; --focus: #2f6b4f;
  --keep: #2f7d4f; --keep-bg: #e3f1e7; --maybe: #9a6a00; --maybe-bg: #fbf0d6;
  --reject: #a33a2c; --reject-bg: #f8e3df; --warn-bg: #fff4d1; --warn-ink: #7a5700;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141614; --surface: #1d201d; --ink: #e8e9e4; --muted: #9aa096; --line: #2e322d;
    --accent: #6fbf93; --accent-ink: #0f1a13; --focus: #6fbf93;
    --keep: #7fd19f; --keep-bg: #1f3427; --maybe: #e6b84d; --maybe-bg: #3a3018;
    --reject: #f08b7b; --reject-bg: #3d221e; --warn-bg: #3a3018; --warn-ink: #e6b84d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 14px 16px 10px; }
.wrap { max-width: 980px; margin: 0 auto; }
h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 13px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip.low b { color: var(--reject); }
.filters { margin-left: auto; display: flex; gap: 4px; }
.filters button, .seg button, .nudge button, .play {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 7px; padding: 4px 10px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.progress { height: 4px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s; }
main { padding: 8px 16px 80px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 26px 0 8px; display: flex; gap: 8px; align-items: baseline; }
h2 code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink);
  text-transform: none; letter-spacing: 0; }
.clip { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  margin-bottom: 6px; scroll-margin: 140px 0 80px; }
.clip.focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.clip.keep { border-left: 4px solid var(--keep); }
.clip.maybe { border-left: 4px solid var(--maybe); }
.clip.reject { opacity: .55; border-left: 4px solid var(--reject); }
.play { width: 38px; height: 38px; border-radius: 50%; padding: 0; font-size: 14px; }
.play.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.text { font-size: 16px; font-weight: 500; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
.meta .warn { background: var(--warn-bg); color: var(--warn-ink); padding: 0 6px; border-radius: 4px; }
.seg { display: flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg button:last-child { border-radius: 0 7px 7px 0; }
.seg button[data-s="keep"][aria-pressed="true"] { background: var(--keep-bg); color: var(--keep); border-color: var(--keep); z-index: 1; position: relative; }
.seg button[data-s="maybe"][aria-pressed="true"] { background: var(--maybe-bg); color: var(--maybe); border-color: var(--maybe); z-index: 1; position: relative; }
.seg button[data-s="reject"][aria-pressed="true"] { background: var(--reject-bg); color: var(--reject); border-color: var(--reject); z-index: 1; position: relative; }
.row2 { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 12px; color: var(--muted); }
.nudge { display: inline-flex; align-items: center; gap: 4px; }
.nudge button { padding: 1px 7px; font-size: 12px; }
.nudge output { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); }
select, input[type=text] { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
input[type=text] { flex: 1; min-width: 140px; }
.busy { opacity: .5; pointer-events: none; }
footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line);
  color: var(--muted); font-size: 12px; padding: 8px 16px; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--ink); }
@media (max-width: 640px) {
  .clip { grid-template-columns: auto 1fr; }
  .seg { grid-column: 1 / 3; }
  .row2 { grid-column: 1 / 3; }
  .filters { margin-left: 0; }
  footer { display: none; }
}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Attenborough clip review</h1>
  <div class="sub">Personal peon-ping pack · <span id="count"></span> · saved to <code>work/review.json</code></div>
  <div class="bar" id="chips"></div>
  <div class="bar">
    <label class="sub"><input type="checkbox" id="autoplay" checked> Auto-play next after a decision</label>
    <div class="filters" id="filters"></div>
  </div>
  <div class="progress"><div id="prog"></div></div>
</div></header>
<main class="wrap" id="list"></main>
<footer><div class="wrap">
  <kbd>Space</kbd> play · <kbd>J</kbd>/<kbd>K</kbd> or <kbd>↓</kbd>/<kbd>↑</kbd> move ·
  <kbd>1</kbd> keep <kbd>2</kbd> maybe <kbd>3</kbd> reject ·
  <kbd>Q</kbd>/<kbd>W</kbd> start −/+ 0.1 s · <kbd>O</kbd>/<kbd>P</kbd> end −/+ 0.1 s
</div></footer>
<script>
const state = { events: [], clips: [], review: {}, filter: "all", focus: 0, playing: null };
const audio = new Audio();
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const secs = t => { const [m, s] = t.split(":"); return +m * 60 + +s; };
const rv = n => state.review[n] || {};
const eventOf = c => rv(c.n).event || c.event;
const fmtAdj = v => (v > 0 ? "+" : "") + (v || 0).toFixed(1);

async function load() {
  const r = await fetch("/api/clips").then(r => r.json());
  Object.assign(state, r);
  const FILTERS = ["all", "undecided", "keep", "maybe", "reject"];
  // ?filter=keep, ?event=task.error (show only that event), ?shot (no focus ring/footer, for screenshots)
  const q = new URLSearchParams(location.search);
  if (FILTERS.includes(q.get("filter"))) state.filter = q.get("filter");
  if (state.events.includes(q.get("event"))) state.only = q.get("event");
  if (q.has("shot")) { state.focus = -1; $("footer").style.display = "none"; }
  $("#filters").innerHTML = FILTERS.map(f => `<button data-f="${f}" aria-pressed="${f === state.filter}">${f}</button>`).join("");
  render();
}

function visible() {
  const evs = state.only ? [state.only] : state.events;
  return evs.flatMap(ev => state.clips.filter(c => eventOf(c) === ev)).filter(c => {
    const s = rv(c.n).status;
    return state.filter === "all" || (state.filter === "undecided" ? !s : s === state.filter);
  });
}

function render() {
  const vis = visible();
  if (state.focus >= 0) state.focus = Math.min(state.focus, Math.max(0, vis.length - 1));
  let html = "", lastEv = null;
  vis.forEach((c, i) => {
    const ev = eventOf(c), r = rv(c.n), dur = (secs(c.end) - secs(c.start)).toFixed(1);
    if (ev !== lastEv) {
      const kept = state.clips.filter(x => eventOf(x) === ev && rv(x.n).status === "keep").length;
      html += `<h2><code>${ev}</code> ${kept} kept</h2>`;
      lastEv = ev;
    }
    const warn = /ear-check/.test(c.note);
    html += `<div class="clip ${r.status || ""} ${i === state.focus ? "focus" : ""}" data-i="${i}" data-n="${c.n}">
      <button class="play ${state.playing === c.n ? "on" : ""}" data-act="play" aria-label="Play">${state.playing === c.n ? "■" : "▶"}</button>
      <div><div class="text">${esc(c.text)}</div>
        <div class="meta"><span>#${c.n}</span><span>${c.source} @ ${c.start}</span><span>${dur}s</span>
          ${c.note ? `<span class="${warn ? "warn" : ""}">${esc(c.note)}</span>` : ""}</div></div>
      <div class="seg">${["keep", "maybe", "reject"].map(s => `<button data-act="status" data-s="${s}" aria-pressed="${r.status === s}">${s}</button>`).join("")}</div>
      <div class="row2">
        <select data-act="event">${state.events.map(e => `<option ${e === ev ? "selected" : ""}>${e}</option>`).join("")}</select>
        <span class="nudge">start <button data-act="nudge" data-k="adj_start" data-d="-0.1">−</button><output>${fmtAdj(r.adj_start)}</output><button data-act="nudge" data-k="adj_start" data-d="0.1">+</button></span>
        <span class="nudge">end <button data-act="nudge" data-k="adj_end" data-d="-0.1">−</button><output>${fmtAdj(r.adj_end)}</output><button data-act="nudge" data-k="adj_end" data-d="0.1">+</button></span>
        <input type="text" data-act="note" placeholder="note (e.g. music too loud, not his voice)" value="${esc(r.note || "")}">
      </div></div>`;
  });
  $("#list").innerHTML = html || `<p class="sub">Nothing in this filter.</p>`;

  const done = state.clips.filter(c => rv(c.n).status).length;
  $("#count").textContent = `${done} / ${state.clips.length} reviewed`;
  $("#prog").style.width = `${(100 * done) / state.clips.length}%`;
  $("#chips").innerHTML = state.events.map(ev => {
    const k = state.clips.filter(c => eventOf(c) === ev && rv(c.n).status === "keep").length;
    return `<span class="chip ${k < 3 ? "low" : ""}">${ev} <b>${k}</b></span>`;
  }).join("");
  document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === state.filter));
}

function play(n) {
  if (state.playing === n) { audio.pause(); state.playing = null; return render(); }
  const c = state.clips.find(c => c.n === n);
  audio.src = `/clips/${encodeURIComponent(c.file)}?v=${Date.now()}`;
  audio.play();
  state.playing = n;
  render();
}
audio.onended = () => { state.playing = null; render(); };

async function save(n, patch) {
  const el = document.querySelector(`.clip[data-n="${n}"]`);
  el && el.classList.add("busy");
  const res = await fetch("/api/review", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ n, ...patch }) }).then(r => r.json());
  if (res.error) { alert(res.error); el && el.classList.remove("busy"); return null; }
  state.review[n] = res.entry;
  return res;
}

function focusClip(i, scroll = true) {
  const vis = visible();
  if (!vis.length) return;
  state.focus = Math.max(0, Math.min(i, vis.length - 1));
  render();
  if (scroll) document.querySelector(`.clip[data-i="${state.focus}"]`)?.scrollIntoView({ block: "nearest" });
}

async function setStatus(n, s) {
  const cur = rv(n).status;
  await save(n, { status: cur === s ? null : s });
  if (cur === s) return render();
  const vis = visible();
  const idx = vis.findIndex(c => c.n === n);
  // In filtered views the decided clip may vanish, so the "next" one is at the same index.
  const nextIdx = vis.some(c => c.n === n) ? idx + 1 : Math.max(0, state.focus);
  const next = vis.slice(nextIdx).find(c => !rv(c.n).status) || vis[nextIdx];
  if (next) { focusClip(vis.indexOf(next)); if ($("#autoplay").checked) play(next.n); }
  else render();
}

async function nudge(n, key, d) {
  const v = Math.round(((rv(n)[key] || 0) + d) * 10) / 10;
  const res = await save(n, { [key]: v });
  if (res) { render(); play(n); }
}

document.addEventListener("click", e => {
  const f = e.target.closest("#filters button");
  if (f) { state.filter = f.dataset.f; state.focus = 0; return render(); }
  const b = e.target.closest("[data-act]"), clip = e.target.closest(".clip");
  if (!clip) return;
  state.focus = +clip.dataset.i;
  if (!b) return render();
  const n = clip.dataset.n;
  if (b.dataset.act === "play") play(n);
  if (b.dataset.act === "status") setStatus(n, b.dataset.s);
  if (b.dataset.act === "nudge") nudge(n, b.dataset.k, +b.dataset.d);
});
document.addEventListener("change", async e => {
  const clip = e.target.closest(".clip");
  if (!clip) return;
  if (e.target.dataset.act === "event") { await save(clip.dataset.n, { event: e.target.value }); render(); }
  if (e.target.dataset.act === "note") await save(clip.dataset.n, { note: e.target.value });
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input[type=text], select") || e.metaKey || e.ctrlKey || e.altKey) return;
  const c = visible()[state.focus];
  if (!c) return;
  const k = e.key.toLowerCase();
  const map = {
    " ": () => play(c.n), j: () => focusClip(state.focus + 1), arrowdown: () => focusClip(state.focus + 1),
    k: () => focusClip(state.focus - 1), arrowup: () => focusClip(state.focus - 1),
    1: () => setStatus(c.n, "keep"), 2: () => setStatus(c.n, "maybe"), 3: () => setStatus(c.n, "reject"),
    q: () => nudge(c.n, "adj_start", -0.1), w: () => nudge(c.n, "adj_start", 0.1),
    o: () => nudge(c.n, "adj_end", -0.1), p: () => nudge(c.n, "adj_end", 0.1),
  };
  if (map[k]) { e.preventDefault(); map[k](); }
});
load();
</script>
</body>
</html>
